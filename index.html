<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kính gửi</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505; 
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        #bgCanvas {
            z-index: 1; 
            /* Bỏ hiệu ứng làm mờ đi, tăng độ sáng lên để sao băng rõ nét */
            opacity: 0.9; 
        }
        #textCanvas {
            z-index: 2; 
            /* Phủ lớp bóng đen cực đậm ngay dưới chữ để ép nó tách ra khỏi nền sao băng */
            filter: drop-shadow(0px 0px 4px rgba(0, 0, 0, 1));
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>
    <canvas id="textCanvas"></canvas>

    <script>
        /* ==========================================
           PHẦN 1: TÙY CHỈNH LỜI CHÚC TẠI ĐÂY
           ========================================== */
        const messages =[
            "Chúc cô gái có 102",
            "Luôn là\nngười xinh\nsố 1 trên thế giới",
            "Hạnh phúc\nnhất",
            "Đạt được\nmọi ước mơ\ncủa mình",
            "Chúc Đỗ Thu Trang",
            "20/10 này\nvui vẻ nhé <3" 
        ];

        /* ==========================================
           PHẦN 2: BACKGROUND MATRIX "L O V E" SẮC NÉT
           ========================================== */
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        bgCanvas.width = window.innerWidth;
        bgCanvas.height = window.innerHeight;

        const chars = "LOVE38".split("");
        const fontSize = 15;
        const columns = bgCanvas.width / fontSize;
        const drops =[];
        
        for (let x = 0; x < columns; x++) {
            drops[x] = Math.random() * -100; 
        }

        function drawMatrix() {
            // Lớp phủ đen làm mờ đuôi sao băng (chỉnh số 0.15)
            bgCtx.fillStyle = "rgba(5, 5, 5, 0.15)";
            bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
            
            bgCtx.font = "bold " + fontSize + "px monospace";
            bgCtx.textAlign = "center";

            for (let i = 0; i < drops.length; i++) {
                if (Math.random() > 0.4) {
                    const text = chars[Math.floor(Math.random() * chars.length)];
                    
                    // Trả lại màu sáng và phát sáng nhẹ cho sao băng để nó không bị chìm
                    bgCtx.fillStyle = Math.random() > 0.5 ? "#ffffff" : "#ffb3c6"; 
                    bgCtx.shadowBlur = 2;
                    bgCtx.shadowColor = bgCtx.fillStyle;
                    
                    bgCtx.fillText(text, i * fontSize, drops[i] * fontSize);
                    bgCtx.shadowBlur = 0; // Reset
                }

                if (drops[i] * fontSize > bgCanvas.height && Math.random() > 0.95) {
                    drops[i] = 0;
                }
                drops[i] += 0.7; 
            }
        }
        setInterval(drawMatrix, 50);

        /* ==========================================
           PHẦN 3: HIỆU ỨNG CHỮ BẢNG LED NỔI BẬT
           ========================================== */
        const canvas = document.getElementById('textCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles =[];
        let messageIndex = 0;
        let isExploding = false;

        class Particle {
            constructor(x, y) {
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                this.targetX = x;
                this.targetY = y;
                
                this.size = 2.2; // Kích thước hạt chữ
                this.vx = 0;
                this.vy = 0;
                this.ease = 0.08; 
                
                this.blinkOffset = Math.random() * Math.PI * 2; 
                this.blinkSpeed = Math.random() * 0.05 + 0.02; 
                
                // Màu chữ: Trắng tinh hoặc Hồng nhạt sáng rực
                this.color = Math.random() > 0.3 ? '255, 255, 255' : '255, 215, 225'; 
            }

            update() {
                if (isExploding) {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vx *= 0.95; 
                    this.vy *= 0.95;
                } else {
                    let dx = this.targetX - this.x;
                    let dy = this.targetY - this.y;
                    this.x += dx * this.ease;
                    this.y += dy * this.ease;
                    
                    if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) {
                        this.x = this.targetX;
                        this.y = this.targetY;
                    }
                }
            }

            draw() {
                // Nhấp nháy Blink Blink
                let alpha = 0.5 + (Math.sin(Date.now() * this.blinkSpeed + this.blinkOffset) * 0.5 + 0.5) * 0.5;
                
                ctx.fillStyle = `rgba(${this.color}, ${alpha})`;
                
                // Độ phát sáng của chữ
                ctx.shadowBlur = 10; 
                ctx.shadowColor = `rgba(${this.color}, ${alpha})`;

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function createParticlesForText(text) {
            const offscreenCanvas = document.createElement('canvas');
            const offCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });
            offscreenCanvas.width = canvas.width;
            offscreenCanvas.height = canvas.height;

            let lines = text.split('\n');
            let baseFontSize = canvas.width > 800 ? 110 : 70; 
            offCtx.font = "900 " + baseFontSize + "px 'Arial'"; 
            offCtx.fillStyle = "white";
            offCtx.textAlign = "center";
            offCtx.textBaseline = "middle";

            let startY = canvas.height / 2 - (lines.length - 1) * (baseFontSize / 2.2);

            lines.forEach((line, index) => {
                offCtx.fillText(line, canvas.width / 2, startY + (index * baseFontSize * 1.1));
            });

            const imageData = offCtx.getImageData(0, 0, canvas.width, canvas.height).data;
            const newTargets =[];
            
            // Gap = 5: Khoảng cách các hạt đèn LED san sát nhau giúp chữ dày
            const gap = 5; 

            for (let y = 0; y < canvas.height; y += gap) {
                for (let x = 0; x < canvas.width; x += gap) {
                    const index = (y * canvas.width + x) * 4;
                    const alpha = imageData[index + 3];
                    if (alpha > 128) {
                        newTargets.push({x, y});
                    }
                }
            }

            if (newTargets.length > particles.length) {
                let diff = newTargets.length - particles.length;
                for(let i=0; i<diff; i++) {
                    particles.push(new Particle(canvas.width/2, canvas.height/2));
                }
            } else if (newTargets.length < particles.length) {
                for(let i = newTargets.length; i < particles.length; i++) {
                     particles[i].targetX = (Math.random() - 0.5) * canvas.width * 3;
                     particles[i].targetY = (Math.random() - 0.5) * canvas.height * 3;
                }
            }

            for (let i = 0; i < newTargets.length; i++) {
                particles[i].targetX = newTargets[i].x;
                particles[i].targetY = newTargets[i].y;
            }
            
            isExploding = false;
        }

        function animateText() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animateText);
        }

        function changeText() {
            isExploding = true;
            
            particles.forEach(p => {
                p.vx = (Math.random() - 0.5) * 25;
                p.vy = (Math.random() - 0.5) * 25;
            });

            setTimeout(() => {
                createParticlesForText(messages[messageIndex]);
                messageIndex = (messageIndex + 1) % messages.length;
            }, 800); 
        }

        animateText();

        // Delay text 2 giây sau khi background đã chạy
        setTimeout(() => {
            createParticlesForText(messages[0]);
            messageIndex++;
            setInterval(changeText, 4500);
        }, 5000);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
            messageIndex = (messageIndex === 0) ? messages.length - 1 : messageIndex - 1;
            createParticlesForText(messages[messageIndex]);
        });

    </script>
</body>
</html>
